apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-ai-sa
  namespace: ia
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-ai-ro
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "pods/log", "events", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-ai-ro-binding
subjects:
  - kind: ServiceAccount
    name: cluster-ai-sa
    namespace: ia
roleRef:
  kind: ClusterRole
  name: cluster-ai-ro
  apiGroup: rbac.authorization.k8s.io
