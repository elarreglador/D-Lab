    import os, pathlib

    def chunk_md(file_path: str):
        text = pathlib.Path(file_path).read_text(encoding='utf-8', errors='ignore')
        lines = text.splitlines()
        chunks = []
        current = []
        start_line = 1
        for i, line in enumerate(lines, 1):
            if line.startswith("## ") and current:
                chunks.append(("\n".join(current), file_path, start_line))
                current = [line]
                start_line = i
            else:
                current.append(line)
        if current:
            chunks.append(("\n".join(current), file_path, start_line))
        result = []
        for txt, fp, sl in chunks:
            tokens = txt.split()
            if len(tokens) <= 500:
                result.append((txt, fp, sl))
            else:
                for j in range(0, len(tokens), 450):
                    sub = " ".join(tokens[j:j+500])
                    result.append((sub, fp, sl + j))
                    if j + 500 >= len(tokens):
                        break
        return result

    def mock_embed(texts):
        import hashlib
        vecs = []
        for t in texts:
            h = hashlib.md5(t.encode()).digest()
            vec = []
            for i in range(384):
                vec.append((h[i % len(h)] - 128) / 128.0)
            vecs.append(vec)
        return vecs

    try:
        from sentence_transformers import SentenceTransformer
        _model = None
        def get_model():
            global _model
            if _model is None:
                _model = SentenceTransformer('all-MiniLM-L6-v2')
            return _model
        def embed(texts):
            return get_model().encode(texts, normalize_embeddings=True).tolist()
    except Exception:
        embed = mock_embed

    # Use in-memory chroma directly to avoid Persistent hang
    try:
        import chromadb
        _client = chromadb.Client()
        def get_collection():
            return _client.get_or_create_collection("docs")
    except Exception as e:
        print(f"chroma fail {e}")
        _mock_store = []
        def get_collection():
            class MockColl:
                def add(self, ids, embeddings, documents, metadatas):
                    for doc, meta in zip(documents, metadatas):
                        _mock_store.append((doc, meta))
                def query(self, query_embeddings, n_results=3):
                    docs = [d[0] for d in _mock_store[:n_results]]
                    metas = [d[1] for d in _mock_store[:n_results]]
                    return {"documents": [docs], "metadatas": [metas]}
                def delete(self, where=None):
                    _mock_store.clear()
                def count(self):
                    return len(_mock_store)
            return MockColl()

    def index_docs(base="/cache/docs"):
        coll = get_collection()
        try:
            coll.delete(where={})
        except:
            pass
        docs = list(pathlib.Path(base).rglob("*.md"))
        all_chunks = []
        for fp in docs:
            all_chunks.extend(chunk_md(str(fp)))
        if not all_chunks:
            return 0
        texts = [c[0] for c in all_chunks]
        metas = [{"file": c[1].replace(base+"/", ""), "line": c[2]} for c in all_chunks]
        ids = [f"{m['file']}:{m['line']}:{i}" for i, m in enumerate(metas)]
        embs = embed(texts)
        batch = 100
        for i in range(0, len(ids), batch):
            coll.add(ids=ids[i:i+batch], embeddings=embs[i:i+batch], documents=texts[i:i+batch], metadatas=metas[i:i+batch])
        return len(all_chunks)

    def query_docs(question: str, k=3):
        coll = get_collection()
        q_emb = embed([question])
        res = coll.query(query_embeddings=q_emb, n_results=k)
        docs = res.get("documents", [[]])[0]
        metas = res.get("metadatas", [[]])[0]
        out = []
        for d, m in zip(docs, metas):
            out.append((d, m.get("file", "?"), m.get("line", 0)))
        # Keyword boost for VIP/NFS: if query contains VIP and no result has 192.168.1.30, search keyword
        if "vip" in question.lower() and not any("192.168.1.30" in d for d, _, _ in out):
            # Fallback keyword search for VIP
            import pathlib as pl
            all_chunks = []
            for fp in pl.Path("/cache/docs").rglob("*.md"):
                txt = fp.read_text(encoding="utf-8", errors="ignore")
                if "192.168.1.30" in txt:
                    # Find line number
                    for i, line in enumerate(txt.splitlines(), 1):
                        if "192.168.1.30" in line:
                            all_chunks.append((line, str(fp).replace("/cache/docs/", ""), i))
                            break
                    if len(all_chunks) >= k:
                        break
            if all_chunks:
                return all_chunks[:k]
        return out
