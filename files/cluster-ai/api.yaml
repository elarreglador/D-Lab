      labels:
        app: cluster-ai-api
    spec:
      serviceAccountName: cluster-ai-sa
      nodeSelector:
        eu.elarreglador/worker: "true"
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: python:3.12-slim
          command: [sh, -c, "apt-get update && apt-get install -y --no-install-recommends build-essential nmap iputils-ping iproute2 net-tools dnsutils arp-scan libpcap0.8 libdbus-1-3 libblas3 libidn2-0 libbpf1 libelf1 libmnl0 libunistring5 && pip install --no-cache-dir --target /tmp/deps -r /app/requirements.txt && mkdir -p /tmp/lib && cp /usr/bin/nmap /tmp/nmap 2>/dev/null || true; cp /bin/ping /tmp/ping 2>/dev/null || true; cp /usr/sbin/ip /tmp/ip 2>/dev/null || true; for lib in libpcap.so libssh2.so libunistring.so liblinear.so liblua5.4.so libdbus-1.so libblas.so libidn2.so libbpf.so libelf.so libmnl.so libcap.so; do cp /usr/lib/x86_64-linux-gnu/$lib* /tmp/lib/ 2>/dev/null || true; cp /lib/x86_64-linux-gnu/$lib* /tmp/lib/ 2>/dev/null || true; done; ldconfig 2>/dev/null || true"]
          volumeMounts:
            - name: code
              mountPath: /app
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 2000m, memory: 2Gi}
      containers:
        - name: api
          image: python:3.12-slim
          command: [sh, -c, "LD_LIBRARY_PATH=/tmp/lib:/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH PATH=/tmp:$PATH PYTHONPATH=/tmp/deps:$PYTHONPATH python -m uvicorn app:app --host 0.0.0.0 --port 8000 --app-dir /app"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TELEGRAM_AI_TOKEN
              valueFrom:
                secretKeyRef: {name: cluster-ai-secret, key: TELEGRAM_AI_TOKEN}
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef: {name: cluster-ai-secret, key: TELEGRAM_CHAT_ID}
            - name: OLLAMA_URL
              value: "http://ollama.ia.svc:11434"
            - name: MODEL
              value: "qwen2.5-coder:3b"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: HF_HOME
              value: "/tmp/hf_cache"
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf_cache"
            - name: SENTENCE_TRANSFORMERS_HOME
              value: "/tmp/hf_cache"
            - name: HF_HUB_CACHE
              value: "/tmp/hf_cache"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: 1000m, memory: 2Gi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: whitelist
              mountPath: /config
              readOnly: true
            - name: docs-cache
              mountPath: /cache
      volumes:
        - name: code
          configMap: {name: cluster-ai-code, defaultMode: 0444}
        - name: tmp
          emptyDir: {}
        - name: whitelist
          configMap: {name: cluster-ai-whitelist}
        - name: docs-cache
          persistentVolumeClaim: {claimName: docs-cache}
