# Job idempotente que activa la aceleración por hardware VAAPI en Jellyfin.
#
# La configuración de transcodificación vive en jellyfin.db, NO en los
# manifiestos: sin este Job, un despliegue limpio o una restauración desde
# backup perderían el ajuste y Jellyfin volvería a transcodificar por software
# (que en el i3-7100T va a 0,21x y corta la reproducción de 4K HEVC 10-bit HDR).
#
# Por qué usuario y contraseña y no la API key: una API key de Jellyfin no
# identifica a ningún usuario, así que da 401 en todo endpoint que requiera
# autorizacion (/Users/Me, /System/Info, /Library/Refresh). Se autentica como
# administrador y se usa el AccessToken devuelto.
#
# Requisitos:
#   - Secret jellyfin-admin (claves JELLYFIN_ADMIN_USER / JELLYFIN_ADMIN_PASSWORD),
#     generado desde info_sensible/jellyfin-admin.env (gitignored):
#       ssh server "kubectl -n multimedia create secret generic jellyfin-admin \
#         --from-env-file=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -" \
#         < info_sensible/jellyfin-admin.env
#   - intel-gpu-plugin.yaml aplicado (DaemonSet en kube-system).
#
# Uso:
#   cat files/multimedia/jellyfin-vaapi.yaml | ssh server "kubectl apply -f -"
#   ssh server "kubectl -n multimedia wait --for=condition=complete job/jellyfin-vaapi --timeout=180s"
#   ssh server "kubectl -n multimedia logs job/jellyfin-vaapi"
#
# Idempotente: lee EncodingOptions, parchea solo lo necesario y reescribe.
# Falla en voz alta si la autenticación o el POST no funcionan.
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-vaapi
  namespace: multimedia
  labels:
    app.kubernetes.io/part-of: multimedia
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: multimedia
    spec:
      restartPolicy: Never
      nodeSelector:
        eu.elarreglador/worker: "true"
      containers:
        - name: configure
          image: python:3.11-alpine
          command:
            - python3
            - -u
            - -c
            - |
              import json, time, urllib.request, urllib.error

              BASE = "http://jellyfin:8096"
              USER = open("/config-admin/user").read().strip()
              PW = open("/config-admin/password").read().strip()

              def req(method, path, token, body=None):
                  r = urllib.request.Request(BASE + path, method=method)
                  if token:
                      r.add_header("Authorization", 'MediaBrowser Token="%s", '
                                  "Client=setup, Device=setup, Version=1.0" % token)
                  r.add_header("Content-Type", "application/json")
                  r.add_header("Accept", "application/json")
                  data = json.dumps(body).encode() if body is not None else None
                  try:
                      with urllib.request.urlopen(r, data=data, timeout=30) as resp:
                          raw = resp.read()
                          return resp.status, json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode(errors="replace")[:400]

              # 1. Esperar a que la API responda (Jellyfin aún arrancando).
              for i in range(60):
                  st, _ = req("GET", "/System/Info/Public", None)
                  if st == 200:
                      break
                  print("  API no lista (%s), esperando... %d/60" % (st, i + 1))
                  time.sleep(3)
              else:
                  raise SystemExit("FAIL: la API de Jellyfin no responde 200")
              print("  API lista")

              # 2. Autenticar como administrador para obtener un AccessToken.
              # OJO: el cliente va en 'Authorization: MediaBrowser ...', no en
              # 'X-Emby-Authorization'. Con este último, Jellyfin lanza
              #   ArgumentNullException (Parameter 'request.App') -> HTTP 400.
              MLBROWSER = ('MediaBrowser Client="setup", Device="setup", '
                           'DeviceId="setup-1", Version="1.0"')
              r = urllib.request.Request(BASE + "/Users/AuthenticateByName",
                                         method="POST")
              r.add_header("Authorization", MLBROWSER)
              r.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(
                          r, data=json.dumps({"Username": USER, "Pw": PW}).encode(),
                          timeout=30) as resp:
                      auth = json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  raise SystemExit("FAIL autenticacion -> %s %s" %
                                   (e.code, e.read().decode(errors="replace")[:300]))
              token = auth.get("AccessToken")
              if not token:
                  raise SystemExit("FAIL: respuesta sin AccessToken")
              print("  Autenticado como '%s'" % auth.get("User", {}).get("Name", USER))

              # 3. Leer la config actual.
              st, cfg = req("GET", "/System/Configuration", token)
              if st != 200 or not isinstance(cfg, dict):
                  raise SystemExit("FAIL GET /System/Configuration -> %s %s" % (st, cfg))

              enc = cfg.get("EncodingOptions") or {}
              # Nombres reales de los campos, verificados contra
              # /config/encoding.xml en Jellyfin 12.2.0 (el GET
              # /System/Configuration NO devuelve EncodingOptions).
              deseados = {
                  "EnableHardwareEncoding": True,
                  "HardwareAccelerationType": "vaapi",
                  "VaapiDevice": "/dev/dri/renderD128",
                  # Ambos flags: 'EnableTonemapping' es el generico y
                  # 'EnableVppTonemapping' el que usa la ruta VAAPI.
                  "EnableTonemapping": True,
                  "EnableVppTonemapping": True,
                  "TonemappingAlgorithm": "bt2390",
                  "TonemappingMode": "auto",
                  "TonemappingRange": "auto",
                  # 'HardwareDecodingCodecs' es el nombre real. Se añade hevc
                  # a los que Jellyfin trae por defecto (h264, vc1).
                  # av1 fuera a proposito: la HD 630 (Gen9) no decodifica AV1.
                  "HardwareDecodingCodecs": ["h264", "vc1", "hevc"],
              }

              pendientes = {k: (enc.get(k), v) for k, v in deseados.items()
                            if enc.get(k) != v}
              if not pendientes:
                  print("  EncodingOptions ya correcto, nada que hacer")
              else:
                  for k, (antes, ahora) in pendientes.items():
                      print("  %s: %r -> %r" % (k, antes, ahora))
                  enc.update(deseados)
                  cfg["EncodingOptions"] = enc
                  st, out = req("POST", "/System/Configuration", token, cfg)
                  if st not in (200, 204):
                      raise SystemExit("FAIL POST -> %s %s" % (st, out))
                  print("  POST /System/Configuration OK (%s)" % st)

              st, chk = req("GET", "/System/Configuration", token)
              print("  GET posterior: HTTP %s" % st)

              # Verificacion fuerte: EncodingOptions se persiste en
              # /config/encoding.xml (el GET /System/Configuration NO lo
              # devuelve en Jellyfin 12.2.0), asi que se comprueba el fichero.
              time.sleep(3)
              xml = ""
              try:
                  xml = open("/config/encoding.xml", encoding="utf-8").read()
              except OSError as e:
                  raise SystemExit("FAIL: no se pudo leer /config/encoding.xml (%s)" % e)

              def tag(name):
                  i = xml.find("<%s>" % name)
                  if i < 0:
                      return None
                  j = xml.find("</%s>" % name, i)
                  return xml[i + len(name) + 2:j]

              comprobar = {
                  "HardwareAccelerationType": "vaapi",
                  "VaapiDevice": "/dev/dri/renderD128",
                  "EnableHardwareEncoding": "true",
                  "TonemappingAlgorithm": "bt2390",
              }
              mal = {k: (tag(k), v) for k, v in comprobar.items() if tag(k) != v}
              if mal:
                  for k, (en, qui) in mal.items():
                      print("  FALLO %s = %r (esperado %r)" % (k, en, qui))
                  raise SystemExit("FAIL verificacion: encoding.xml no tiene lo esperado")
              print("  encoding.xml verificado:")
              for k in comprobar:
                  print("    %-24s = %s" % (k, tag(k)))
              if "hevc" in (tag("HardwareDecodingCodecs") or ""):
                  print("    HardwareDecodingCodecs incluye hevc")
              else:
                  print("    AVISO: hevc no esta en HardwareDecodingCodecs "
                        "(Jellyfin lo rechaza en silencio; HEVC se decodifica "
                        "por software y solo el encode va a la GPU)")

              # El tonemapping HDR->SDR es AVISO, no fallo: Jellyfin rechaza
              # EnableTonemapping/EnableVppTonemapping cuando vainfo no lista
              # VAProcFilter (comprobado en Jellyfin 12.2.0 + iHD 26.3.5 sobre
              # la HD 630), aunque tonemap_vaapi si funcione en ffmpeg puro.
              # Afecta solo a contenido HDR/Dolby Vision; el SDR transcodifica
              # por hardware sin problemas.
              for k in ("EnableTonemapping", "EnableVppTonemapping"):
                  if tag(k) != "true":
                      print("  AVISO: %s = %r (Jellyfin rechaza el tonemapping VPP)"
                            % (k, tag(k)))
              print("OK")
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: admin
              mountPath: /config-admin
            # readOnly: solo para verificar /config/encoding.xml. El PVC
            # local-static tiene nodeAffinity a k8s-worker-1, igual que el
            # PVC de Jellyfin, así que el Job cae en el mismo nodo.
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: admin
          secret:
            secretName: jellyfin-admin
            items:
              - key: JELLYFIN_ADMIN_USER
                path: user
              - key: JELLYFIN_ADMIN_PASSWORD
                path: password
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-local
