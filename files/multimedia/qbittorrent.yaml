apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: multimedia
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        fsGroup: 1000
      nodeSelector:
        eu.elarreglador/worker: "true"
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          ports:
            - containerPort: 8080
              name: webui
            - containerPort: 6881
              name: torrent-tcp
              protocol: TCP
            - containerPort: 6881
              name: torrent-udp
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Madrid
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: multimedia
  labels:
    app: qbittorrent
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.58
  externalTrafficPolicy: Local
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
---
# Puerto de escucha de torrents: TCP y UDP, expuesto como NodePort para la cadena pública
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-torrent
  namespace: multimedia
  labels:
    app: qbittorrent
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.59
  externalTrafficPolicy: Local
  selector:
    app: qbittorrent
  ports:
    - name: torrent-tcp
      port: 6881
      targetPort: 6881
      protocol: TCP
      nodePort: 31681
    - name: torrent-udp
      port: 6881
      targetPort: 6881
      protocol: UDP
      nodePort: 31681
