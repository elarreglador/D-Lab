apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-init-libraries
  namespace: multimedia
  labels:
    app.kubernetes.io/part-of: multimedia
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: multimedia
    spec:
      restartPolicy: Never
      containers:
        - name: jellyfin-config
          image: lscr.io/linuxserver/jellyfin:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Madrid
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for Jellyfin to be ready..."
              for i in {1..60}; do
                if curl -s http://jellyfin:8096/ > /dev/null 2>&1; then
                  echo "Jellyfin is ready"
                  break
                fi
                echo "Attempt $i/60 - waiting..."
                sleep 2
              done

              echo "Adding library paths to Jellyfin..."
              
              # Jellyfin stores library config in /config/data/library.db (SQLite)
              # We use the API to add libraries instead of direct DB manipulation
              
              JELLYFIN_URL="http://jellyfin:8096"
              CONFIG_DIR="/config"
              
              # Wait for API to be responsive
              for i in {1..30}; do
                RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$JELLYFIN_URL/System/Info")
                if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "401" ]; then
                  echo "Jellyfin API is responsive (code $RESPONSE)"
                  break
                fi
                echo "API not ready (code $RESPONSE), waiting..."
                sleep 2
              done

              # Check if libraries already exist by looking at the config
              if grep -q "qbittorrent" "$CONFIG_DIR/data/library.db" 2>/dev/null; then
                echo "Libraries already configured, skipping..."
                exit 0
              fi

              # Create library.xml configuration directly in Jellyfin's config
              # This approach manipulates the library configuration file
              cat > "$CONFIG_DIR/data/library.xml.tmp" << 'EOF'
              <LibraryOptions>
                <LibraryFolder>
                  <ItemRepository>MediaFolder</ItemRepository>
                  <Path>/media/qbittorrent/movies</Path>
                  <LibraryMediaType>movies</LibraryMediaType>
                  <IsEnabled>true</IsEnabled>
                  <SaveLocalMetadata>true</SaveLocalMetadata>
                  <RefreshIntervalDays>0.04167</RefreshIntervalDays>
                </LibraryFolder>
                <LibraryFolder>
                  <ItemRepository>MediaFolder</ItemRepository>
                  <Path>/media/qbittorrent/tv</Path>
                  <LibraryMediaType>tvshows</LibraryMediaType>
                  <IsEnabled>true</IsEnabled>
                  <SaveLocalMetadata>true</SaveLocalMetadata>
                  <RefreshIntervalDays>0.04167</RefreshIntervalDays>
                </LibraryFolder>
                <LibraryFolder>
                  <ItemRepository>MediaFolder</ItemRepository>
                  <Path>/media/amule/movies</Path>
                  <LibraryMediaType>movies</LibraryMediaType>
                  <IsEnabled>true</IsEnabled>
                  <SaveLocalMetadata>true</SaveLocalMetadata>
                  <RefreshIntervalDays>0.04167</RefreshIntervalDays>
                </LibraryFolder>
                <LibraryFolder>
                  <ItemRepository>MediaFolder</ItemRepository>
                  <Path>/media/amule/tv</Path>
                  <LibraryMediaType>tvshows</LibraryMediaType>
                  <IsEnabled>true</IsEnabled>
                  <SaveLocalMetadata>true</SaveLocalMetadata>
                  <RefreshIntervalDays>0.04167</RefreshIntervalDays>
                </LibraryFolder>
              </LibraryOptions>
              EOF

              cp "$CONFIG_DIR/data/library.xml.tmp" "$CONFIG_DIR/data/library.xml" 2>/dev/null || echo "Will create library config on next Jellyfin startup"
              
              echo "Library configuration prepared"
              echo "Jellyfin will auto-scan libraries on next restart"
              
              # Ensure proper permissions
              chown -R 1000:1000 "$CONFIG_DIR"
              chmod 644 "$CONFIG_DIR/data/library.xml" 2>/dev/null || true
              
              echo "Done!"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: qbittorrent-downloads
              mountPath: /media/qbittorrent
            - name: amule-downloads
              mountPath: /media/amule
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: qbittorrent-downloads
          persistentVolumeClaim:
            claimName: media-data
            subPath: torrents
        - name: amule-downloads
          persistentVolumeClaim:
            claimName: media-data
            subPath: amule/incoming
