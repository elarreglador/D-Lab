# Definiciones Cardigann custom para Prowlarr. Se montan en
# /config/Definitions/Custom (read-only) dentro del pod. Prowlarr las carga al
# arrancar; un cambio en este ConfigMap requiere reiniciar el pod (rollout).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-custom-defs
  namespace: multimedia
  labels:
    app: prowlarr
data:
  divxtotal.yml: |
    ---
    # Definición Cardigann v11 (custom) para DivxTotal.
    # Definición propia de D-Lab: el sitio no tiene soporte integrado en Prowlarr.
    # Las fuentes de búsqueda cambian de dominio con frecuencia; si divxtotal.foo
    # rota, actualizar `links` y el `baseUrl` del indexador.
    id: divxtotal
    name: DivxTotal
    description: "DivxTotal is a SPANISH site for Movies, TV series and Software"
    language: es-ES
    type: public
    encoding: UTF-8
    requestDelay: 2
    links:
      - https://divxtotal.foo/

    caps:
      categorymappings:
        - {id: peliculas, cat: Movies/SD, desc: "Películas"}
        - {id: peliculas-hd, cat: Movies/HD, desc: "Películas HD"}
        - {id: peliculas-3-d, cat: Movies/3D, desc: "Películas 3D"}
        - {id: peliculas-dvdr, cat: Movies/DVD, desc: "Películas DVD-r"}
        - {id: series, cat: TV/SD, desc: "Series"}
        - {id: programas, cat: PC, desc: "Programas"}
        - {id: otros, cat: Other/Misc, desc: "Otros"}

      modes:
        search: [q]
        tv-search: [q, season, ep]
        movie-search: [q]
        music-search: [q]
        book-search: [q]

    settings:
      - name: info_0
        type: info
        label: "DivxTotal es una fuente española (películas, series y programas). Sin búsqueda sin keywords (RSS): devuelve 0 resultados."

    search:
      paths:
        - path: "{{ if .Keywords }}?s={{ .Keywords }}{{ else }}?s={{ end }}"
          method: get

      headers:
        User-Agent: ["Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"]

      rows:
        selector: table.table tbody tr

      fields:
        title:
          selector: td:nth-child(1) a
        details:
          selector: td:nth-child(1) a
          attribute: href
        download:
          selector: td:nth-child(1) a
          attribute: href
        category:
          selector: td:nth-child(1) a
          attribute: href
          filters:
            - name: split
              args: ["/", 3]
        date:
          selector: td:nth-child(3)
          filters:
            - name: dateparse
              args: "dd-MM-yyyy"
        size:
          selector: td:nth-child(4)
          filters:
            - name: re_replace
              args: ["(?i)N/A", "700 MB"]
        seeders:
          text: 1
        leechers:
          text: 0
        downloadvolumefactor:
          text: 0
        uploadvolumefactor:
          text: 1

    # El enlace real (.torrent) vive en la página de detalle; se obtiene al hacer
    # el grab: el bloque `download` hace GET a la URL del resultado y extrae el
    # enlace download_tt.php (películas: 1 enlace; series: primer capítulo).
    download:
      selectors:
        - selector: a[href*="download_tt.php"]
          attribute: href

    # engine: WordPress custom (DivxTotal)