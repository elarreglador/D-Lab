apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-auto-scan
  namespace: multimedia
  labels:
    app.kubernetes.io/part-of: multimedia
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3300
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: multimedia
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: jellyfin-scanner
              image: curlimages/curl:latest
              env:
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-apikey
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false
                runAsNonRoot: true
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=========================================="
                  echo "Jellyfin Auto Scan (CronJob) - $(date)"
                  echo "=========================================="
                  
                  JELLYFIN_URL="http://jellyfin:8096"
                  
                  # Wait for Jellyfin API (with API key)
                  echo "Waiting for Jellyfin API..."
                  for i in $(seq 1 30); do
                    RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Emby-Token: $JELLYFIN_API_KEY" "$JELLYFIN_URL/System/Info" || echo "000")
                    if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "401" ]; then
                      echo "Jellyfin API is ready (HTTP $RESPONSE)"
                      break
                    fi
                    echo "  Attempt $i/30 - waiting... (HTTP $RESPONSE)"
                    sleep 2
                    if [ "$i" = "30" ]; then
                      echo "Jellyfin API not ready after 60s, exiting"
                      exit 1
                    fi
                  done
                  
                  # Trigger library scan (requires API key)
                  echo ""
                  echo "Triggering library scan for all libraries..."
                  SCAN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                    "$JELLYFIN_URL/Library/Refresh" \
                    -H "Content-Type: application/json" \
                    -H "X-Emby-Token: $JELLYFIN_API_KEY" || echo -e "\n000")
                  
                  HTTP_CODE=$(echo "$SCAN_RESPONSE" | tail -1)
                  BODY=$(echo "$SCAN_RESPONSE" | head -n -1)
                  
                  if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
                    echo "Scan triggered successfully (HTTP $HTTP_CODE)"
                  else
                    echo "Failed to trigger scan (HTTP $HTTP_CODE)"
                    echo "Response: $BODY"
                    exit 1
                  fi
                  
                  echo ""
                  echo "Scan trigger completed at $(date)"
                  echo "Jellyfin will index new files in background"
                  echo "=========================================="
