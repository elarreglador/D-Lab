apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-badge
  namespace: multimedia
  labels:
    app: es-badge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: es-badge
  template:
    metadata:
      labels:
        app: es-badge
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-2
      containers:
        - name: es-badge
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: JELLYFIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: es-badge-jf
                  key: JELLYFIN_API_TOKEN
            - name: NGINX_ENVSUBST_FILTER
              value: JELLYFIN_API_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /es-badge.js
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /es-badge.js
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/templates
            - name: badge-js
              mountPath: /usr/share/nginx/html
        - name: api
          image: node:20-alpine
          command: ["node", "/app/es-badge-api.js"]
          ports:
            - containerPort: 8080
          env:
            - name: PROWLARR_APIKEY
              valueFrom:
                secretKeyRef:
                  name: es-badge-jf
                  key: PROWLARR_APIKEY
            - name: PROWLARR_URL
              value: http://prowlarr:9696
            - name: INDEXER_IDS
              value: "6,7,8"
            - name: CACHE_FILE
              value: /cache/cache.json
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: api-src
              mountPath: /app
      volumes:
        - name: nginx-conf
          configMap:
            name: es-badge-nginx
        - name: badge-js
          configMap:
            name: es-badge-js
        - name: cache
          emptyDir: {}
        - name: api-src
          configMap:
            name: es-badge-api
---
apiVersion: v1
kind: Service
metadata:
  name: es-badge
  namespace: multimedia
  labels:
    app: es-badge
spec:
  type: ClusterIP
  selector:
    app: es-badge
  ports:
    - port: 80
      targetPort: 80