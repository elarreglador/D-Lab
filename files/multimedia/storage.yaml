apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: multimedia
  labels:
    app.kubernetes.io/part-of: multimedia
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 400Gi
  storageClassName: nfs-storage-v4
---
# PVs locales estáticos para las configuraciones por app (BDs SQLite + ajustes).
# Motivo: SQLite sobre NFS (GlusterFS) sufre "database is locked" intermitente que
# crash-loopea las apps .NET (Sonarr/Radarr). El almacenamiento local vive en el
# LXC de cada nodo en /srv/k8s-local/<app>. Pods de réplica única: cada uno queda
# fijado a su nodo vía nodeSelector en el Deployment + nodeAffinity del PV.
# Estado 2026-08-20: sonarr/radarr/prowlarr consumen estos PV locales (la migración
# a NFS se revirtió: fsync ~66ms en Gluster-HDD replicado, ver 03-Aplicaciones.md).
# qBittorrent/jellyfin/jellyseerr corren sobre los PVC NFS *-config (menos presión
# de escritura SQLite); sus PV locales quedan Bound/Retain sin consumidores (rollback).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-sonarr-config
  labels:
    app.kubernetes.io/part-of: multimedia
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  local:
    path: /srv/k8s-local/sonarr
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-1
---
