# Plantilla para el portátil G9 (split-tunnel, sin DNS).
# Copiar a /etc/wireguard/wg0.conf en G9 con permisos 600.
# PSK compartida generada junto a la clave de G9 y registrada en el peer del servidor (DV0).

[Interface]
PrivateKey = <PRIVATE_KEY_G9>
Address = 10.8.0.100/24, fd42:42:42::100/128

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
PresharedKey = <PRESHARED_KEY_G9>
Endpoint = elarreglador.eu:51820
AllowedIPs = 10.8.0.1/32, 10.8.0.11/32, 10.8.0.12/32
PersistentKeepalive = 25