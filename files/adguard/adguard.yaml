apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: adguard
  labels:
    app: adguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      nodeSelector:
        eu.elarreglador/worker: "true"
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.79
          # La imagen oficial usa -c /opt/adguardhome/conf/AdGuardHome.yaml y
          # -w /opt/adguardhome/work. Aquí se unifica en un único PVC: config y
          # datos (sessions.db, stats.db) viven en el mismo directorio del PVC.
          args:
            - --no-check-update
            - -c
            - /opt/adguardhome/work/AdGuardHome.yaml
            - -w
            - /opt/adguardhome/work
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/work
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-data
