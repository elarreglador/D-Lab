apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telegram-bot-allow
  namespace: pods
spec:
  podSelector:
    matchLabels:
      app: telegram-bot
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Acceso abierto: cualquier pod del cluster puede notificar
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    # Tambien ipBlock para probes kubelet/host (no cubiertos por NetworkPolicy k8s puro)
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Telegram Bot API (HTTPS). Se permite 0.0.0.0/0:443 para simplicidad;
    # para hardening restringir a rangos Telegram: 149.154.160.0/20, 91.108.4.0/22
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
