# Dashboard 'Sistema D-Lab' provisionado por el sidecar kiwigrid (label grafana_dashboard: "1").
# Muestra CPU y RAM de los hosts físicos D1/D2 (job host-node, label host) y de los 4 nodos K8s
# (job node-exporter, filtrando por instance). Los valores están en porcentaje de uso (0-100).
# Para publicarlo en la landing se usa un public dashboard (ver scripts/ensure-public-dashboard.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sistema-dlab
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
