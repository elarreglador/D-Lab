          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 0 },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value_and_name"
          },
          "pluginVersion": "13.1.1",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "editorMode": "code",
              "expr": "100 - avg by (host) (rate(node_cpu_seconds_total{job=\"dv0-host\", host=\"dv0\", mode=\"idle\"}[5m])) * 100",
              "legendFormat": "CPU",
              "range": true,
              "refId": "A"
