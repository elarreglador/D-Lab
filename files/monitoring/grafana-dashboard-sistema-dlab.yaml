        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "VM IONOS (jumpbox, VPN WireGuard, nginx; 10.8.0.1) vía relay en D2",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 60 },
                  { "color": "red", "value": 85 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
