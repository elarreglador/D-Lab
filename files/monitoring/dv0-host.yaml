apiVersion: v1
kind: Service
metadata:
  labels:
    app: dv0-host
  name: dv0-host
  namespace: monitoring
spec:
  clusterIP: None
  type: ClusterIP
  ports:
    - name: metrics
      port: 9100
      targetPort: 19200
---
apiVersion: v1
kind: Endpoints
metadata:
  name: dv0-host
  namespace: monitoring
subsets:
  # DV0 (VM IONOS) no está en la LAN del cluster; su node_exporter (10.8.0.1:9100, túnel
  # WireGuard) se scrapea vía un relay (socat) en D2, igual que D1.
  - addresses:
      - ip: 192.168.1.12
    ports:
      - name: metrics
        port: 19200
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: dv0-host
    release: kube-prometheus-stack
  name: dv0-host
  namespace: monitoring
spec:
  endpoints:
    - path: /metrics
      port: metrics
      relabelings:
        - replacement: dv0
          targetLabel: host
  selector:
    matchLabels:
      app: dv0-host
