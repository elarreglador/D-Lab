apiVersion: v1
kind: Namespace
metadata:
  name: pods
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtl-sdr
  namespace: pods
  labels:
    app: rtl-sdr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtl-sdr
  template:
    metadata:
      labels:
        app: rtl-sdr
    spec:
      nodeSelector:
        eu.elarreglador/sdr: "true"
      containers:
        - name: rtl-tcp
          image: skl256/rtl_tcp:latest
          ports:
            - containerPort: 1234
              name: rtltcp
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            exec:
              command: ["pgrep", "rtl_tcp"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["pgrep", "rtl_tcp"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pgrep", "rtl_tcp"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: usb
              mountPath: /dev/bus/usb
      volumes:
        - name: usb
          hostPath:
            path: /dev/bus/usb
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: rtl-sdr
  namespace: pods
  labels:
    app: rtl-sdr
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.60
  externalTrafficPolicy: Local
  selector:
    app: rtl-sdr
  ports:
    - port: 1234
      targetPort: 1234
      nodePort: 31234
